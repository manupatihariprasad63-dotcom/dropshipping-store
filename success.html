<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Velora | Order successful</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body { display: grid; place-items: center; min-height: 100vh; }
    .success-box {
      max-width: 560px; background: #fff; border: 1px solid #ececec; border-radius: 16px;
      padding: 2rem; box-shadow: 0 25px 70px rgba(0,0,0,0.06);
    }
    .success-box h2 { margin-top: 0; }
    .success-box a { color: #0b72ff; }
  </style>
</head>
<body>
  <div class="success-box">
    <h2>Thank you for your order!</h2>
    <p>Your payment has been successfully processed.</p>
    <p>Velora team will contact you to confirm shipping details and delivery.</p>
    <p><a href="shop.html">Continue shopping</a></p>
  </div>
</body>
</html>
