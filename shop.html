<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Shop | Velora</title>
  <meta name="description" content="Shop premium Velora hoodies and streetwear essentials.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <div class="brand-wrap">
        <span class="brand-mark">V</span>
        <h1 class="logo">Velora</h1>
      </div>
      <nav>
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <button id="cart-button" class="cart-btn">Cart (<span id="cart-count">0</span>)</button>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="shop-intro">
      <h2>Shop our hoodie collection</h2>
      <p>Premium comfort, everyday style, and global shipping for all our best-selling pieces.</p>
    </section>

    <div id="products" class="product-grid"></div>
  </main>

  <footer>
    <div class="container footer-inner">
      <p>&copy; <span id="year"></span> Velora</p>
      <p>Call/WhatsApp: <a href="tel:+9182852029">+91 82852029</a></p>
    </div>
  </footer>

  <div id="cart-modal" class="cart-modal hidden">
    <div class="cart-content">
      <button id="close-cart" class="close">×</button>
      <h3>Your cart</h3>
      <div id="cart-items"></div>
      <div class="cart-footer">
        <div>Total: $<span id="cart-total">0.00</span></div>
        <button id="checkout-btn" class="btn primary">Checkout</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>document.getElementById('year').textContent = new Date().getFullYear()</script>
</body>
</html>
