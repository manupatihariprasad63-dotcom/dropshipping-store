<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Contact — My Dropshipping Store</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <h1 class="logo">My Dropshipping Store</h1>
      <nav>
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <h2>Contact</h2>
    <p>Questions? Fill the form and we'll get back to you.</p>

    <!-- Replace the action URL with your Formspree endpoint -->
    <form id="contact-form" method="POST" action="https://formspree.io/f/YOUR_FORM_ID">
      <label>Name</label>
      <input name="name" required>
      <label>Email</label>
      <input name="email" type="email" required>
      <label>Message</label>
      <textarea name="message" rows="5" required></textarea>
      <button class="btn" type="submit">Send</button>
    </form>
  </main>

  <footer>
    <div class="container">
      <p>&copy; <span id="year"></span> My Dropshipping Store</p>
    </div>
  </footer>
  <script>document.getElementById('year').textContent = new Date().getFullYear()</script>
</body>
</html>
